<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Studio | Artist Portfolio</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-dark: #060608;
            --bg-card: rgba(17, 17, 21, 0.6);
            --border-color: rgba(255, 255, 255, 0.05);
            --aqua: #00e5ff;
            --neon-green: #39ff14;
            --text-light: #ffffff;
            --text-muted: #8a8a93;
            --dragon-glow: #00e5ff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* --- SMOOTH 3D SNAKE DRAGON TRAIL WITH LONG TAIL --- */
        .dragon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99999;
            perspective: 1000px;
        }

        .dragon-segment {
            position: absolute;
            top: 0;
            left: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--aqua), #0044ff);
            box-shadow: 0 0 12px var(--dragon-glow);
            will-change: transform;
            transform-style: preserve-3d;
            transition: background 0.2s ease;
        }

        .dragon-segment.dragon-head {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #ffffff, var(--aqua));
            box-shadow: 0 0 25px #ffffff, 0 0 15px var(--aqua);
        }
        
        .dragon-segment.dragon-head::before {
            content: '▲';
            position: absolute;
            top: -8px;
            left: 4px;
            font-size: 10px;
            color: var(--aqua);
            text-shadow: 0 0 5px var(--aqua);
        }

        .dragon-segment::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--neon-green);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* --- GLOBAL SIGNATURE BRANDING --- */
        .dev-signature {
            position: fixed;
            bottom: 1.5rem;
            right: 2rem;
            z-index: 999;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            background: rgba(6, 6, 8, 0.7);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
            pointer-events: auto;
            animation: pulseGlow 3s infinite alternate;
        }

        .dev-signature span {
            color: var(--aqua);
            font-weight: 700;
        }

        /* --- NAVIGATION / TASK BAR --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            z-index: 100;
            background: rgba(6, 6, 8, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            animation: slideDown 0.6s ease-out;
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--text-light);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .nav-logo:hover {
            transform: scale(1.05);
        }

        .nav-logo span {
            color: var(--aqua);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--aqua);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
            transform: translateY(-2px);
        }

        /* --- PAGE MANAGEMENT & GLOBAL ANIMATIONS --- */
        .page-view {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        .page-view.active-page {
            display: block;
            animation: fadeInPage 0.5s ease-out forwards;
        }

        /* --- HOME STYLE WITH CINEMATIC MOON --- */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .moon-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 480px;
            height: 480px;
            z-index: 1;
            pointer-events: none;
        }

        .cinematic-moon {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #80f2ff 0%, rgba(0, 229, 255, 0.18) 45%, transparent 70%);
            border-radius: 50%;
            filter: blur(35px);
            opacity: 0.5;
            animation: moonGlowPulse 7s ease-in-out infinite alternate;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .welcome-text {
            font-size: 1.2rem;
            color: var(--aqua);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 0.5rem;
            font-weight: 600;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .main-title {
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 40%, #80f2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 45px rgba(0, 229, 255, 0.35));
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .hero-btn {
            padding: 0.8rem 2rem;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-decoration: none;
        }

        .hero-btn-primary {
            background: var(--aqua);
            color: var(--bg-dark);
            border: 1px solid var(--aqua);
        }

        .hero-btn-primary:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
        }

        .hero-btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid var(--border-color);
        }

        .hero-btn-secondary:hover {
            border-color: var(--aqua);
            color: var(--aqua);
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        /* --- ABOUT SECTION --- */
        .about-section {
            padding: 8rem 2rem 6rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .page-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.75rem;
        }

        .page-header h2 span {
            color: var(--aqua);
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text h3 {
            font-size: 1.6rem;
            color: var(--aqua);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .about-text p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
        }

        .about-showcase {
            background: rgba(17, 17, 21, 0.4);
            border: 1px solid var(--border-color);
            border-top: 2px solid var(--aqua);
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .about-showcase:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.15);
        }

        .about-showcase h4 {
            font-size: 3.5rem;
            color: #fff;
            font-weight: 800;
        }

        /* --- MEMBERS & LEADS AREA --- */
        .inner-page-padding {
            padding: 8rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            margin-bottom: 4rem;
        }

        .member-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: border-color 0.3s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .member-card:hover, .folder-card:hover, .channel-card:hover {
            border-color: var(--aqua) !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), 0 12px 30px rgba(0, 0, 0, 0.6);
            transform: translateY(-6px) scale(1.01);
        }

        .member-img-banner {
            width: 100%;
            height: 240px;
            object-fit: cover;
            object-position: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.2);
            transition: transform 0.5s ease;
        }
        
        .member-card:hover .member-img-banner {
            transform: scale(1.03);
        }

        .member-info {
            padding: 1.75rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .member-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .member-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            word-break: break-word;
        }

        .member-role {
            color: var(--aqua);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(0, 229, 255, 0.06);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid rgba(0, 229, 255, 0.15);
            white-space: nowrap;
        }

        .member-stats-line {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding: 0.75rem 0;
            margin-bottom: 1rem;
            font-size: 0.8rem;
        }

        .stat-box span {
            display: block;
            color: var(--text-muted);
            font-size: 0.7()rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-box p {
            color: #fff;
            font-weight: 600;
        }

        .member-bio {
            color: #a0a0a8;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            min-height: 65px;
        }

        /* --- ACCORDION FOLDERS SYSTEM --- */
        .folder-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 6rem;
        }

        .folder-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.4s ease, transform 0.3s ease;
        }
        
        .folder-card:hover:not(.folder-open) {
            transform: translateY(-2px);
        }

        .folder-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 6px;
            background: var(--aqua);
            border-radius: 0 0 4px 0;
        }

        .folder-header-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .folder-meta-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .folder-icon {
            font-size: 2.5rem;
            color: var(--aqua);
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.2));
            transition: transform 0.4s ease;
        }

        .folder-info h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.2rem;
            letter-spacing: 0.5px;
        }

        .folder-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .folder-toggle-indicator {
            font-size: 1.4rem;
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .folder-content-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .folder-content-inner {
            overflow: hidden;
        }

        .folder-card.folder-open {
            border-color: rgba(0, 229, 255, 0.5) !important;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }

        .folder-card.folder-open .folder-toggle-indicator {
            transform: rotate(180deg);
            color: var(--aqua);
        }

        .folder-card.folder-open .folder-content-wrapper {
            grid-template-rows: 1fr;
        }

        .folder-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
            width: 100%;
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .image-space {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            aspect-ratio: 4 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .image-space img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .image-space:hover img {
            transform: scale(1.08);
        }

        .image-space:hover {
            border-color: rgba(0, 229, 255, 0.5);
            transform: scale(1.04);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.25);
        }

        /* --- REVIEWS SYSTEM --- */
        .reviews-section {
            margin-bottom: 4rem;
            background: rgba(17, 17, 21, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .review-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.3s ease;
        }
        
        .review-card:hover {
            transform: translateY(-3px);
        }

        .review-user {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .review-name {
            font-weight: 700;
            color: #fff;
            font-size: 1rem;
        }

        .review-stars {
            color: var(--aqua);
            font-size: 0.9rem;
        }

        .review-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        .add-review-box {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 2rem;
        }

        .add-review-box h4 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.25rem;
            color: #fff;
        }

        .review-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .review-inputs input, .review-inputs select, .add-review-box textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
            transition: border-color 0.3s;
        }

        .review-inputs select
